name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Allow only one concurrent deployment, but don't cancel an in-progress run
# (so the artifact is always available).
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Actions pinned to full commit SHAs (not floating major tags) so an
      # upstream-action compromise can't quietly run on our next push.
      # Update SHAs deliberately via Dependabot or by re-resolving the tag.
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          # Nothing here pushes back to the repo, so don't leave the
          # GITHUB_TOKEN in the runner's git config — a later compromised
          # step can't then reuse persisted credentials.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      # ci.yml runs this same suite (npm ci → audit → test → build) as the PR
      # gate — when a step is added or changed here, mirror it there.
      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        # Supply-chain gate: fail the deploy if a high/critical advisory exists
        # in the locked dependency tree before anything ships to the live site.
        run: npm audit --audit-level=high

      - name: Test (physics + outcome invariants)
        run: npm test

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
