# PR test gate. deploy.yml runs the web suite only on push to main (i.e. after
# merge), so without this workflow a pull request gets zero automated coverage
# of the web game or the api-worker — a broken PR was only caught when the
# post-merge deploy failed. Both packages now gate the merge itself.
# Actions are pinned to full commit SHAs, same policy as deploy.yml.
name: ci

on:
  pull_request:
  workflow_dispatch: {}

# A new push to the same PR supersedes the in-flight run — no stacked
# duplicate runs (deploy.yml keeps cancel-in-progress false; this gate has no
# artifact to protect).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Deliberately non-hermetic: a newly published high/critical advisory
      # fails PRs with no code change. That matches deploy.yml's existing
      # policy (advisories block shipping until a Dependabot bump lands).
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build

  api-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-worker
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: api-worker/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
