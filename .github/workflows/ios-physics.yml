# Physics-parity gate for the native iOS port. The WobblePhysics package is
# pure Swift (no UI imports), so its XCTest suite — including the
# golden-trajectory comparison against fixtures exported from the TypeScript
# engine — runs on a Linux Swift container. Any divergence between the Swift
# and TS physics fails this job.
name: ios-physics

# tests/fixtures/** is in the path filters because the golden files are the
# parity contract: the exporter writes identical copies to tests/fixtures/ and
# ios/.../Fixtures/, and a re-export must re-run the Swift suite against the
# new truth (not silently keep passing against stale fixtures).
on:
  push:
    paths:
      - 'ios/WobblePhysics/**'
      - 'tests/fixtures/**'
      - '.github/workflows/ios-physics.yml'
  pull_request:
    paths:
      - 'ios/WobblePhysics/**'
      - 'tests/fixtures/**'
      - '.github/workflows/ios-physics.yml'

permissions:
  contents: read

jobs:
  swift-test:
    runs-on: ubuntu-24.04
    container: swift:6.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Fixture parity (web copy == bundled iOS copy)
        # The Swift suite reads ONLY the bundled Fixtures/ via Bundle.module, so
        # a divergence between the two committed copies (hand edit, partial
        # export, bad merge resolution) would otherwise test stale goldens and
        # stay green. git diff --no-index exits non-zero on any difference.
        run: git diff --no-index --stat tests/fixtures ios/WobblePhysics/Tests/WobblePhysicsTests/Fixtures
      - name: Run physics parity suite
        working-directory: ios/WobblePhysics
        run: swift test
