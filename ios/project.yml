# XcodeGen spec — run `xcodegen generate` in this directory to produce
# InfiniteBinaryWobble.xcodeproj (keeps the .xcodeproj out of git).
#   brew install xcodegen && cd ios && xcodegen generate
name: InfiniteBinaryWobble
options:
  bundleIdPrefix: com.carousella
  deploymentTarget:
    iOS: "17.0"
packages:
  WobblePhysics:
    path: WobblePhysics
targets:
  InfiniteBinaryWobble:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: WobblePhysics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carousella.infinitebinarywobble
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_CFBundleDisplayName: Binary Wobble
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Automatic signing with your team — set via Xcode or:
        # DEVELOPMENT_TEAM: YOURTEAMID
