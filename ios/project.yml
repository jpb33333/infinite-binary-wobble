# XcodeGen spec — run `xcodegen generate` in this directory to produce
# InfiniteBinaryWobble.xcodeproj (keeps the .xcodeproj out of git).
#   brew install xcodegen && cd ios && xcodegen generate
name: InfiniteBinaryWobble
options:
  bundleIdPrefix: com.bowditch
  deploymentTarget:
    iOS: "17.0"
packages:
  WobblePhysics:
    path: WobblePhysics
  # gstack /ios-qa debug bridge. Every source line is #if DEBUG-gated, so the
  # linked modules are EMPTY in Release builds — see ios/DebugBridge/Package.swift.
  DebugBridge:
    path: DebugBridge
targets:
  InfiniteBinaryWobble:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: WobblePhysics
      - package: DebugBridge
        product: DebugBridgeCore
      - package: DebugBridge
        product: DebugBridgeUI
    # Info-plist keys live HERE (xcodegen writes App/Info.plist at generate
    # time; it is gitignored like the .xcodeproj) — not as INFOPLIST_KEY_*
    # build settings, because UIAppFonts has no INFOPLIST_KEY_ mapping and
    # mixing an explicit plist with generate-time keys silently drops them.
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Binary Wobble
        # With an explicit Info.plist, the MARKETING_VERSION /
        # CURRENT_PROJECT_VERSION build settings only reach the bundle through
        # these variable references — without them xcodegen hardcodes 1.0/1
        # and version bumps in this file silently stop applying.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Export compliance (pinned in docs/ios/V1-LOCK.md, never implemented).
        # The app ships no non-exempt encryption — no network, no custom crypto;
        # only Apple's own StoreKit/OS-level encryption, which is exempt. Declaring
        # this here skips the per-upload "missing compliance" prompt in App Store
        # Connect and is the honest answer for this binary.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad family (TARGETED_DEVICE_FAMILY "1,2") without all four
        # orientations fails App Store upload validation (ITMS-90474) unless
        # the app declares fullscreen-only. Going iPhone-only instead is a
        # product call — docs/ios/V1-LOCK.md pinned iPhone-only for the old V1.
        UIRequiresFullScreen: true
        # Bundled SIL-OFL fonts (App/Resources/Fonts; full license text +
        # per-file SHA-256 provenance in App/Resources/FontLicenses.txt).
        # Theme.swift degrades to system serif/sans if a font fails to load.
        # Cardo-Bold has no caller yet — bundled for the About-screen wordmark
        # (docs/ios/ABOUT-SCREEN.md) so the family ships complete.
        UIAppFonts:
          - Cardo-Regular.ttf
          - Cardo-Italic.ttf
          - Cardo-Bold.ttf
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bowditch.infinitebinarywobble
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        # App icon: a single 1024 opaque (no-alpha) PNG in the asset catalog,
        # rendered procedurally from the real engine (eccentricity-matched
        # binary-wobble ∞). Required for App Store submission.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Automatic signing. Personal (free) team selected in Xcode 2026-06-10
        # and persisted here so headless xcodebuild needs no GUI. Team IDs are
        # not secret (they ship in every IPA's embedded.mobileprovision).
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: B52N5TMBSW
    # Run the app-layer unit tests through the app's own scheme:
    #   xcodebuild test -scheme InfiniteBinaryWobble -destination 'platform=iOS Simulator,...'
    scheme:
      testTargets:
        - InfiniteBinaryWobbleTests
      # Local StoreKit Testing — the in-app purchase runs on the simulator with
      # no paid account / App Store Connect. The real product is configured in
      # App Store Connect before submission (post-enrollment).
      run:
        storeKitConfiguration: Store/Unlock.storekit
  # App-layer unit tests (PlayMeter, monetization gate, …). Hosted by the app
  # so the test bundle can `@testable import InfiniteBinaryWobble`. The physics
  # package keeps its own swift-test suite under WobblePhysics/.
  InfiniteBinaryWobbleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: InfiniteBinaryWobble
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bowditch.infinitebinarywobble.tests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: B52N5TMBSW
