<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A two-player gravitational binary-star game." />
    <!-- Installable web app: home-screen icon + fullscreen on iOS Safari.
         viewport-fit stays at the default (auto) on purpose — the contain-fit
         letterbox is void-colored, so the safe-area inset is invisible and
         no control can ever sit under a notch or the home indicator. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#1A0F14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Binary Wobble" />
    <!-- Social link previews -->
    <meta property="og:title" content="Infinite Binary Wobble" />
    <meta property="og:description" content="A two-player gravitational binary-star game." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jpb33333.github.io/infinite-binary-wobble/" />
    <meta property="og:image" content="https://jpb33333.github.io/infinite-binary-wobble/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <title>Infinite Binary Wobble</title>
    <!-- Strict Content-Security-Policy. default-src 'none' denies every
         resource type by default; only same-origin script/style/img/font/
         manifest are re-allowed, plus frame-src for the one sanctioned outsider:
         the SoundCloud embed the music pill opens (its player runs entirely
         inside its own iframe; nothing external loads into THIS page)
         (manifest-src set explicitly — it falls back
         to default-src 'none', which silently blocked the PWA manifest), and
         the game makes zero network requests (connect falls back to 'none').
         require-trusted-types-for neutralises DOM-XSS sinks.
         Delivered via <meta> because GitHub Pages can't set HTTP headers, so
         the header-only protections (frame-ancestors, X-Frame-Options, etc.)
         are documented in SECURITY.md and clickjacking is blocked by the JS
         frame-buster in main.ts.
         BUILD-TIME COUPLING: the meteringCsp plugin in vite.config.ts widens
         this policy by string-replacing on the exact script-src and font-src
         directives in the content attribute below (first match in the file —
         which is why this comment must never quote them verbatim). The build
         fails loudly if either anchor stops matching. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; manifest-src 'self'; frame-src https://w.soundcloud.com; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'"
    />
    <!-- Don't leak the game's URL to any site a player navigates to from here. -->
    <meta name="referrer" content="no-referrer" />
    <!-- Fonts are self-hosted from /fonts/ via @font-face in style.css —
         no Google Fonts request on every page load, no IP/UA leak. -->
  </head>
  <body>
    <noscript>
      <p class="noscript-notice">
        Infinite Binary Wobble is a canvas game and needs JavaScript to run.
        Please enable it (there are no trackers, ads, or third-party scripts here).
      </p>
    </noscript>
    <canvas id="stage" width="1280" height="800" aria-label="Celestial Court"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
